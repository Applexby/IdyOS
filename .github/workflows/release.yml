# Publica una versión nueva de IdyOS para Windows.
#
# Cómo lanzar una versión:
#   1. Sube el número en package.json ("version": "1.0.1") en la rama main
#   2. GitHub → Actions → "Publicar IdyOS" → Run workflow (crea el tag solo)
#      (o desde consola: git tag v1.0.1 && git push --tags)
# GitHub compila el .exe, crea el Release y los programas instalados lo
# detectan solos (punto en el engranaje + aviso).
#
# Versiones beta: usa una versión con guion, p. ej. 1.1.0-beta.1 (tag v1.1.0-beta.1).
# Solo la reciben quienes activen "Recibir versiones de prueba".

name: Publicar IdyOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que el tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::package.json dice $V pero el tag es ${GITHUB_REF_NAME}"; exit 1; }

      - run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      # Al lanzarlo con el botón "Run workflow" no hay tag: se crea aquí con la
      # versión de package.json (GitHub exige un tag para publicar el Release).
      - name: Crear tag de la versión (si no existe)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "El tag v$V ya existe"
          else
            git tag "v$V" && git push origin "v$V"
          fi

      - name: Compilar y publicar
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          TIPO=release; [[ "$V" == *-* ]] && TIPO=prerelease
          npm run build:server
          npx electron-builder --win --publish always -c.publish.releaseType=$TIPO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: '1'
