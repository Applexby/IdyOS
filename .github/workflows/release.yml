# Publica una versión nueva de IdyOS para Windows.
#
# Automático: cada vez que llega a main un package.json con una versión que
# todavía no tiene Release (p. ej. "version": "1.0.1"), se compila el .exe,
# se crea el tag v1.0.1 y se publica el Release. Los programas instalados lo
# detectan solos (punto en el engranaje + aviso).
#
# También se puede lanzar a mano: Actions → "Publicar IdyOS" → Run workflow.
#
# Versiones beta: usa una versión con guion, p. ej. 1.1.0-beta.1. Solo la
# reciben quienes activen "Recibir versiones de prueba".

name: Publicar IdyOS

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-idyos
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: ¿Esta versión ya está publicada?
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "La versión $V ya está publicada: no se hace nada."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versión nueva: $V"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: comprobar
    if: needs.comprobar.outputs.publicar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      # Se crea UN solo Release en borrador antes de compilar: si lo creara
      # electron-builder, cada archivo que sube en paralelo podría crear su propio
      # Release duplicado (pasó en la 1.0.1). Al final se publica.
      - name: Crear tag y Release v${{ needs.comprobar.outputs.version }} (borrador)
        shell: bash
        run: |
          V="${{ needs.comprobar.outputs.version }}"
          git tag "v$V" && git push origin "v$V"
          gh release create "v$V" --draft --title "$V" --notes "$(git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y subir archivos
        shell: bash
        run: |
          npm run build:server
          npx electron-builder --win --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Publicar Release
        shell: bash
        run: |
          V="${{ needs.comprobar.outputs.version }}"
          gh release view "v$V" --json assets --jq '.assets[].name'
          gh release view "v$V" --json assets --jq '.assets[].name' | grep -qx latest.yml || { echo "::error::Falta latest.yml"; exit 1; }
          if [[ "$V" == *-* ]]; then gh release edit "v$V" --draft=false --prerelease
          else gh release edit "v$V" --draft=false --latest; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Si algo falla, se borra el borrador y el tag para que el próximo intento vuelva a publicar
      - name: Deshacer si falló
        if: failure()
        shell: bash
        run: |
          V="${{ needs.comprobar.outputs.version }}"
          gh release delete "v$V" --yes || true
          git push origin --delete "v$V" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
