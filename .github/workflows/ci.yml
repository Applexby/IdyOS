# Comprueba en cada push que el sistema compila (sin publicar nada).
name: Comprobar compilación

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:server
        env:
          NEXT_TELEMETRY_DISABLED: '1'
